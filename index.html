
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Signup Form</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 350px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            color: #333;
        }

        .input-box {
            margin-bottom: 18px;
        }

        .input-box input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            outline: none;
            font-size: 15px;
        }

        .input-box input:focus {
            border-color: #667eea;
        }

        .error {
            color: red;
            font-size: 12px;
            margin-top: 5px;
        }

        .success {
            color: green;
            text-align: center;
            margin-bottom: 15px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #5265c7;
        }

        .switch {
            text-align: center;
            margin-top: 18px;
            font-size: 14px;
        }

        .switch span {
            color: #667eea;
            cursor: pointer;
            font-weight: bold;
        }

        #signupForm {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <!-- Login Form -->
    <form id="loginForm">
        <h2>Login</h2>

        <div class="success" id="loginSuccess"></div>

        <div class="input-box">
            <input type="email" id="loginEmail"
                   placeholder="Enter Email">
            <div class="error" id="loginEmailError"></div>
        </div>

        <div class="input-box">
            <input type="password" id="loginPassword"
                   placeholder="Enter Password">
            <div class="error" id="loginPasswordError"></div>
        </div>

        <button type="submit">Login</button>

        <div class="switch">
            Don't have an account?
            <span onclick="showSignup()">Sign Up</span>
        </div>
    </form>


    <!-- Signup Form -->
    <form id="signupForm">
        <h2>Sign Up</h2>

        <div class="success" id="signupSuccess"></div>

        <div class="input-box">
            <input type="text" id="name"
                   placeholder="Enter Your Name">
            <div class="error" id="nameError"></div>
        </div>

        <div class="input-box">
            <input type="email" id="signupEmail"
                   placeholder="Enter Email">
            <div class="error" id="signupEmailError"></div>
        </div>

        <div class="input-box">
            <input type="password" id="signupPassword"
                   placeholder="Create Password">
            <div class="error" id="signupPasswordError"></div>
        </div>

        <div class="input-box">
            <input type="password" id="confirmPassword"
                   placeholder="Confirm Password">
            <div class="error" id="confirmPasswordError"></div>
        </div>

        <button type="submit">Create Account</button>

        <div class="switch">
            Already have an account?
            <span onclick="showLogin()">Login</span>
        </div>
    </form>

</div>

<script>

    // Switch between forms
    function showSignup() {
        document.getElementById("loginForm").style.display = "none";
        document.getElementById("signupForm").style.display = "block";
    }

    function showLogin() {
        document.getElementById("signupForm").style.display = "none";
        document.getElementById("loginForm").style.display = "block";
    }

    // Email validation
    function validateEmail(email) {
        let pattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        return pattern.test(email);
    }

    // Login validation
    document.getElementById("loginForm").addEventListener("submit", function(e) {

        e.preventDefault();

        let email = document.getElementById("loginEmail").value.trim();
        let password = document.getElementById("loginPassword").value;

        let valid = true;

        document.getElementById("loginEmailError").innerText = "";
        document.getElementById("loginPasswordError").innerText = "";
        document.getElementById("loginSuccess").innerText = "";

        if (!validateEmail(email)) {
            document.getElementById("loginEmailError").innerText =
                "Please enter a valid email address.";
            valid = false;
        }

        if (password.length < 8) {
            document.getElementById("loginPasswordError").innerText =
                "Password must be at least 8 characters.";
            valid = false;
        }

        if (valid) {
            document.getElementById("loginSuccess").innerText =
                "Login validation successful!";
        }

    });


    // Signup validation
    document.getElementById("signupForm").addEventListener("submit", function(e) {

        e.preventDefault();

        let name = document.getElementById("name").value.trim();
        let email = document.getElementById("signupEmail").value.trim();
        let password = document.getElementById("signupPassword").value;
        let confirmPassword = document.getElementById("confirmPassword").value;

        let valid = true;

        document.getElementById("nameError").innerText = "";
        document.getElementById("signupEmailError").innerText = "";
        document.getElementById("signupPasswordError").innerText = "";
        document.getElementById("confirmPasswordError").innerText = "";
        document.getElementById("signupSuccess").innerText = "";

        if (name === "") {
            document.getElementById("nameError").innerText =
                "Name is required.";
            valid = false;
        }

        if (!validateEmail(email)) {
            document.getElementById("signupEmailError").innerText =
                "Please enter a valid email address.";
            valid = false;
        }

        if (password.length < 8) {
            document.getElementById("signupPasswordError").innerText =
                "Password must be at least 8 characters.";
            valid = false;
        }

        if (confirmPassword !== password || confirmPassword === "") {
            document.getElementById("confirmPasswordError").innerText =
                "Passwords do not match.";
            valid = false;
        }

        if (valid) {
            document.getElementById("signupSuccess").innerText =
                "Signup validation successful!";
        }

    });

</script>

</body>
</html>
